<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#08090b">
  <meta name="description" content="RoXThal Art Design — Arte, tatuajes y formación artística.">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/roxthal.css">

  <title>RoXThal Art Design</title>
</head>

<body>

  <div id="appShell" class="app-shell">

    <header class="topbar">

      <button
        class="brand"
        type="button"
        data-route="inicio"
        aria-label="Ir al inicio"
      >
        
<img
  class="brand-mark"
  src="https://raw.githubusercontent.com/xtroxthal-dot/roxthal-art-design/main/logo-roxthal.png?v=20260905"
  alt="RoXThal Art Design"
  width="42"
  height="42"
  style="width:42px;height:42px;object-fit:contain;display:block;border-radius:50%;"
>
        <span class="brand-text">
          <strong>RoXThal</strong>
          <small>ART DESIGN</small>
        </span>
      </button>

      <button
        id="themeToggle"
        class="icon-button"
        type="button"
        aria-label="Cambiar tema"
      >
        ◐
      </button>

    </header>

    <main
      id="app"
      class="main"
      aria-live="polite"
    ></main>

    <nav
      class="bottom-nav"
      aria-label="Navegación principal"
    >

      <button
        class="nav-item active"
        type="button"
        data-route="inicio"
        aria-current="page"
      >
        <span>⌂</span>
        <small>Inicio</small>
      </button>

      <button
        class="nav-item"
        type="button"
        data-route="arte"
      >
        <span>✦</span>
        <small>Arte</small>
      </button>

      <button
        class="nav-item"
        type="button"
        data-route="tatuajes"
      >
        <span>✎</span>
        <small>Tatuajes</small>
      </button>

      <button
        class="nav-item"
        type="button"
        data-route="formacion"
      >
        <span>▣</span>
        <small>Formación</small>
      </button>

      <button
        class="nav-item"
        type="button"
        data-route="mas"
      >
        <span>•••</span>
        <small>Más</small>
      </button>

    </nav>

  </div>

  <noscript>
    <div class="noscript">
      RoXThal Art Design necesita JavaScript activado para funcionar.
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>

</body>
</html>
